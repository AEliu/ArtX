[project]
name = "artx"
version = "0.4.2.dev0"
description = "Download high-resolution artwork images with resumable tile downloads and local stitching"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28,<0.29",
    "typer>=0.12",
    "pillow>=11.1,<12",
    "rich>=14.1,<15",
    "json5>=0.9",
    "pycryptodome>=3.23,<4",
    "artfetch>=0.1.0",
]

[project.scripts]
artx = "artx.cli:main"
google-art = "google_art.cli:app"

[project.urls]
Repository = "https://github.com/AEliu/ArtX"
Issues = "https://github.com/AEliu/ArtX/issues"

[project.optional-dependencies]
large-images = [
    "numpy>=2.4.3",
    "pyvips>=3.1.1",
    "tifffile>=2026.3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.1",
    "pytest-httpx>=0.30",
    "ruff>=0.15.6",
    "mypy>=1.19.1",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]

[build-system]
requires = ["hatchling>=1.23"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artx", "src/googleart_download", "src/google_art"]

[tool.hatch.build.targets.sdist]
exclude = ["/art.jpg", "/art.png"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[tool.uv]
package = true
